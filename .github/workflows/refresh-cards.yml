name: Refresh profile cards

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render cards
        run: python3 render.py
      - name: Commit cards
        run: |
          git config user.name "Naitik Kashyap"
          git config user.email "real.darkbytex@gmail.com"
          git add cards/ contributions.json
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
