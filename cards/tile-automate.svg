<svg xmlns="http://www.w3.org/2000/svg" width="258" height="148" viewBox="0 0 258 148" role="img"><style>
  * { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .fade { opacity: 0; animation: fadeUp .7s ease forwards; }
